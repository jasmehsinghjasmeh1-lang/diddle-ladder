
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diddle Ladder Game</title>
<style>
body {
  background-color: #f4f6f9;
  margin: 0;
  padding: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
}
#d-gm-c {
  width: min(380px, calc(100vw - 24px));
  background: #fff;
  border: 3px solid #2b2b2b;
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-sizing: border-box;
}
#d-hd {
  display: flex;
  justify-content: center;
  align-items: center;
  border-bottom: 2px solid #f0f0f0;
  padding-bottom: 10px;
}
#d-tl {
  font-size: 20px;
  font-weight: 800;
  color: #1976d2;
  margin: 0;
  text-align: center;
}
#d-df-s {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
}
.df-b {
  width: 100%;
  padding: 12px;
  border: 2px solid #ccc;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  background: #fafafa;
}
.df-b[data-diff="EASY"] { border-color: #4caf50; color: #2e7d32; }
.df-b[data-diff="MEDIUM"] { border-color: #ff9800; color: #ef6c00; }
.df-b[data-diff="HARD"] { border-color: #f44336; color: #c62828; }
.df-b[data-diff="EXTREME"] { border-color: #9c27b0; color: #6a1b9a; }
#d-gm-l {
  display: none;
  flex-direction: column;
  gap: 12px;
}
.d-tg-b {
  background: #e3f2fd;
  border: 1.5px dashed #1976d2;
  border-radius: 6px;
  padding: 8px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  color: #0d47a1;
}
#d-hi-s {
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 4px;
  border: 1px solid #f5f5f5;
  border-radius: 6px;
}
.d-ld-r {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}
.d-tl-b {
  aspect-ratio: 1;
  border: 2px solid #ddd;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 16px;
  font-weight: bold;
  text-transform: uppercase;
  border-radius: 6px;
  background: #fafafa;
}
.d-tl-b.st-t { background: #efebe9; border-color: #bcaaa4; color: #5d4037; }
.d-tl-b.sc-t { background: #e8f5e9; border-color: #81c784; color: #2e7d32; }
.d-ct { display: flex; gap: 6px; }
#d-in {
  flex: 1;
  min-width: 0;
  padding: 10px;
  border: 2px solid #ccc;
  border-radius: 8px;
  text-transform: uppercase;
  font-size: 15px;
  font-weight: bold;
  text-align: center;
  letter-spacing: 2px;
}
.d-b-m {
  background: #1976d2;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 0 16px;
  font-weight: bold;
  cursor: pointer;
}
#d-ms {
  font-size: 13px;
  font-weight: bold;
  text-align: center;
  min-height: 18px;
  color: #666;
}
.d-b-s {
  background: #f5f5f5;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 8px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  color: #555;
  text-align: center;
  width: 100%;
}
#d-kb { display: flex; flex-direction: column; gap: 4px; }
.kb-r { display: flex; justify-content: center; gap: 4px; }
.kb-k {
  flex: 1;
  max-width: 32px;
  height: 34px;
  background: #e0e0e0;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}
.kb-k.del { max-width: 50px; background: #ef9a9a; }
button:disabled { opacity: 0.55; cursor: not-allowed; }
</style>
</head>
<body>
<div id="d-gm-c">
  <div id="d-hd">
    <h1 id="d-tl">🪜 DIDDLE LADDER</h1>
  </div>

  <div id="d-df-s">
    <div style="font-weight:bold;margin-bottom:5px;">Select starting difficulty:</div>
    <button class="df-b" data-diff="EASY">EASY</button>
    <button class="df-b" data-diff="MEDIUM">MEDIUM</button>
    <button class="df-b" data-diff="HARD">HARD</button>
    <button class="df-b" data-diff="EXTREME">EXTREME</button>
  </div>

  <div id="d-gm-l">
    <div class="d-tg-b"></div>
    <div id="d-hi-s"></div>
    <div class="d-ct">
      <input type="text" id="d-in" maxlength="6" placeholder="REAL WORD" autocomplete="off">
      <button class="d-b-m" id="d-step-btn">STEP</button>
    </div>
    <div id="d-ms"></div>
    <div class="d-ut-r">
      <button class="d-b-s" id="d-menu-btn">⬅️ Main Menu</button>
    </div>
    <div id="d-kb"></div>
  </div>
</div>

<script>
const TARGET = "DIDDLE";

const POOLS = {
  EASY: ["FIDDLE", "PUDDLE", "RIDDLE", "SADDLE", "MUDDLE"],
  MEDIUM: ["CANDLE", "GENTLE", "GIGGLE", "CATTLE", "BUBBLE"],
  HARD: ["BITTER", "POCKET", "PACKED", "PICKLE", "POPPED"],
  EXTREME: ["FROZEN", "MONKEY", "ROCKET", "KITTEN", "COFFEE"]
};

const DICTIONARY_RAW =
"DIDDLE,FIDDLE,PUDDLE,RIDDLE,SADDLE,MUDDLE,CANDLE,GENTLE,GIGGLE,CATTLE,BUBBLE,BITTER,POCKET,PACKED,PICKLE,POPPED,FROZEN,MONKEY,ROCKET,KITTEN,COFFEE,BATTLE,JIGGLE,CUDDLE,HUDDLE,WADDLE,MEDDLE,PEDDLE,TATTLE,LITTLE,RATTLE,SETTLE,KETTLE,BOTTLE,SUBTLE,MANTLE,CASTLE,CRADLE,SICKLE,TICKLE,FICKLE,BUCKLE,NICKEL,TICKER,PACKER,PICKER,COCKLE,DOCKER,DOCKET,JACKET,PADDLE,LITTER,LOCKET,LETTER,BETTER,MATTER,GUTTER,MUTTER,RATTER,TATTER,WINTER,WINNER,DINNER,BANNER,MANNER,REPAIR,REMAIN,FACTOR,DOCTOR,BARKED,MARKED,PARKED,LOCKER,ROCKER,BUFFER,DIFFER,SUFFER,GATHER,RATHER,FATHER,MOTHER";

const REAL_DICTIONARY = new Set(DICTIONARY_RAW.split(","));
let dictionaryLoaded = false;

// Load a larger public English word list.
// This is not Poople's exact dictionary.
fetch("https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt")
  .then(response => {
    if (!response.ok) throw new Error("Dictionary download failed");
    return response.text();
  })
  .then(text => {
    text.split(/\s+/).forEach(word => {
      const w = word.trim().toUpperCase();
      if (/^[A-Z]{6}$/.test(w)) REAL_DICTIONARY.add(w);
    });
    dictionaryLoaded = true;
  })
  .catch(() => {
    // The built-in fallback list still works offline.
  });

let path = [];
let used = new Set();

const tl = document.getElementById("d-tl");
const dfS = document.getElementById("d-df-s");
const gLy = document.getElementById("d-gm-l");
const tgB = document.querySelector(".d-tg-b");
const scC = document.getElementById("d-hi-s");
const inp = document.getElementById("d-in");
const btn = document.getElementById("d-step-btn");
const msg = document.getElementById("d-ms");
const bMn = document.getElementById("d-menu-btn");
const kbC = document.getElementById("d-kb");

document.querySelectorAll(".df-b").forEach(button => {
  button.addEventListener("click", () => {
    startWithDifficulty(button.getAttribute("data-diff"));
  });
});

// On-screen keyboard
const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];

rows.forEach((letters, rowIndex) => {
  const row = document.createElement("div");
  row.className = "kb-r";

  letters.split("").forEach(letter => {
    const key = document.createElement("button");
    key.className = "kb-k";
    key.textContent = letter;
    key.type = "button";

    key.addEventListener("click", () => {
      if (!inp.disabled && inp.value.length < 6) {
        inp.value += letter;
        inp.focus();
      }
    });

    row.appendChild(key);
  });

  if (rowIndex === 2) {
    const del = document.createElement("button");
    del.className = "kb-k del";
    del.textContent = "⌫";
    del.type = "button";

    del.addEventListener("click", () => {
      if (!inp.disabled) {
        inp.value = inp.value.slice(0, -1);
        inp.focus();
      }
    });

    row.appendChild(del);
  }

  kbC.appendChild(row);
});

function startWithDifficulty(level) {
  const pool = POOLS[level];
  const startWord = pool[Math.floor(Math.random() * pool.length)];

  path = [startWord];
  used = new Set([startWord]);

  let color = "#1976d2";
  if (level === "EASY") color = "#4caf50";
  if (level === "MEDIUM") color = "#ff9800";
  if (level === "HARD") color = "#f44336";
  if (level === "EXTREME") color = "#9c27b0";

  tl.textContent = `🪜 DIDDLE LADDER (${level})`;
  tl.style.color = color;
  btn.style.backgroundColor = color;

  inp.disabled = false;
  btn.disabled = false;
  inp.value = "";

  tgB.style.borderColor = color;
  tgB.style.color = color;
  tgB.textContent = `Transform "${startWord}" into "${TARGET}"`;

  msg.style.color = "#666";
  msg.textContent = dictionaryLoaded
    ? "Change exactly 1 letter each turn."
    : "Change exactly 1 letter each turn. Loading extra words…";

  dfS.style.display = "none";
  gLy.style.display = "flex";
  drawLadder(color);
}

function drawLadder(color) {
  scC.replaceChildren();

  path.forEach((word, wordIndex) => {
    const row = document.createElement("div");
    row.className = "d-ld-r";

    const previousWord = path[wordIndex - 1] || null;

    for (let i = 0; i < 6; i++) {
      const tile = document.createElement("div");
      tile.className = "d-tl-b";
      tile.textContent = word[i];

      if (word === TARGET) {
        tile.classList.add("sc-t");
      } else if (wordIndex === 0) {
        tile.classList.add("st-t");
      } else if (previousWord && previousWord[i] !== word[i]) {
        tile.style.backgroundColor = "#e3f2fd";
        tile.style.borderColor = color;
        tile.style.color = color;
      }

      row.appendChild(tile);
    }

    scC.appendChild(row);
  });

  scC.scrollTop = scC.scrollHeight;
}

function submitGuess() {
  const guess = inp.value.toUpperCase().trim();
  const currentWord = path[path.length - 1];

  if (guess.length !== 6) {
    msg.textContent = "Word must be 6 letters long!";
    return;
  }

  if (!REAL_DICTIONARY.has(guess)) {
    msg.textContent = "❌ Word not found in the dictionary. Check spelling or try another word.";
    return;
  }

  if (used.has(guess)) {
    msg.textContent = "Already used that word!";
    return;
  }

  let differences = 0;

  for (let i = 0; i < 6; i++) {
    if (guess[i] !== currentWord[i]) differences++;
  }

  if (differences !== 1) {
    msg.textContent = "Must change exactly 1 letter!";
    return;
  }

  path.push(guess);
  used.add(guess);
  inp.value = "";
  msg.textContent = "Good step!";

  drawLadder(btn.style.backgroundColor);

  if (guess === TARGET) {
    msg.textContent = "🎉 Victory!";
    msg.style.color = "#4caf50";
    inp.disabled = true;
    btn.disabled = true;
  }
}

btn.addEventListener("click", submitGuess);

inp.addEventListener("keydown", event => {
  if (event.key === "Enter") submitGuess();
});

bMn.addEventListener("click", () => {
  dfS.style.display = "flex";
  gLy.style.display = "none";
  tl.textContent = "🪜 DIDDLE LADDER";
  tl.style.color = "#1976d2";
});
</script>
</body>
</html>
